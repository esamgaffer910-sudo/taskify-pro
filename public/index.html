<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taskify Pro | SaaS Workspace</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .auth-wrapper { display: flex; justify-content: center; align-items: center; width: 100%; min-height: 100vh; padding: 20px; position: relative; z-index: 10; }
        .auth-card { background: var(--bg-card); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); border: 1px solid var(--border-glass); padding: 40px; border-radius: 20px; width: 100%; max-width: 420px; box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6), 0 0 30px rgba(147, 51, 234, 0.2); }
        .auth-card h2 { font-size: 28px; font-weight: 700; margin-bottom: 8px; background: linear-gradient(135deg, #e9d5ff 0%, #c084fc 50%, #9333ea 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-align: center; }
        .auth-card p { color: var(--text-secondary); text-align: center; margin-bottom: 24px; font-size: 14.5px; }
        .auth-form { display: flex; flex-direction: column; gap: 16px; }
        .auth-input-group { position: relative; display: flex; align-items: center; }
        .auth-input { width: 100%; padding: 14px 48px 14px 18px; background: rgba(15, 11, 31, 0.6); border: 1px solid var(--border-glass); border-radius: 12px; color: var(--text-primary); font-size: 15px; outline: none; transition: all 0.3s; }
        .auth-input:focus { border-color: var(--border-highlight); box-shadow: 0 0 15px rgba(147, 51, 234, 0.3); }
        .password-toggle-btn { position: absolute; right: 15px; background: none; border: none; cursor: pointer; color: var(--text-secondary); display: flex; align-items: center; justify-content: center; transition: color 0.2s; }
        .password-toggle-btn:hover { color: #c084fc; }
        .password-toggle-btn svg { width: 20px; height: 20px; stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
        .auth-btn { padding: 14px; background: linear-gradient(135deg, #a855f7 0%, #7e22ce 100%); color: white; border: none; border-radius: 12px; font-weight: 600; font-size: 16px; cursor: pointer; transition: all 0.25s; box-shadow: 0 6px 20px var(--purple-glow); }
        .auth-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(168, 85, 247, 0.65); }
        .auth-switch { text-align: center; margin-top: 18px; color: var(--text-secondary); font-size: 14px; }
        .auth-switch span { color: #c084fc; cursor: pointer; font-weight: 600; }
        .auth-switch span:hover { text-decoration: underline; }
        .error-msg { color: var(--danger); text-align: center; font-size: 13.5px; margin-bottom: 12px; }
        .user-profile-bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding-bottom: 16px; border-bottom: 1px solid var(--border-glass); margin-bottom: 20px; }
        .logout-btn { background: rgba(244, 63, 94, 0.1); color: #fb7185; border: 1px solid rgba(244, 63, 94, 0.3); padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 12.5px; font-weight: 600; transition: all 0.2s; white-space: nowrap; }
        .logout-btn:hover { background: var(--danger); color: white; }
        .sidebar-user-wrap { padding: 20px 20px 0 20px; }
        .hidden { display: none !important; }

        @media (max-width: 768px) {
            .auth-wrapper { padding: 16px; }
            .auth-card { padding: 24px 18px; border-radius: 16px; }
            .auth-card h2 { font-size: 24px; }
            .sidebar-user-wrap { padding: 14px 16px 0 16px; }
            .user-profile-bar { margin-bottom: 8px; padding-bottom: 12px; }
        }
    </style>
</head>
<body>
<div class="ambient-glow glow-1"></div>
<div class="ambient-glow glow-2"></div>

<div id="auth-container" class="auth-wrapper">
    <div class="auth-card">
        <h2 id="auth-title">Welcome Back</h2>
        <p id="auth-subtitle">Sign in to access your personal workspace</p>
        <div id="auth-error" class="error-msg"></div>
        <form id="auth-form" class="auth-form" onsubmit="handleAuth(event)">
            <input type="text" id="username" placeholder="Username" class="auth-input" required autocomplete="off">
            <div class="auth-input-group">
                <input type="password" id="password" placeholder="Password" class="auth-input" required>
                <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility()" title="Show/Hide Password">
                    <svg id="eye-icon" viewBox="0 0 24 24">
                        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                        <line x1="1" y1="1" x2="23" y2="23"/>
                    </svg>
                </button>
            </div>
            <button type="submit" id="auth-submit-btn" class="auth-btn">Sign In</button>
        </form>
        <div class="auth-switch">
            <span id="switch-text" onclick="toggleAuthMode()">Don't have an account? Sign Up</span>
        </div>
    </div>
</div>

<div id="app-container" class="app-container hidden">
    <aside class="sidebar">
        <div class="logo"><h2>Taskify Pro</h2></div>
        <div class="sidebar-user-wrap">
            <div class="user-profile-bar">
                <span id="display-username" style="font-weight: 600; color: #e9d5ff; font-size: 14px;"></span>
                <button class="logout-btn" onclick="logout()">Logout</button>
            </div>
        </div>
        <ul class="nav-links"><li class="active"><a>My Tasks</a></li></ul>
    </aside>

    <main class="main-content">
        <header class="header">
            <h1>Task Dashboard</h1>
            <p>Organize your daily workflow with ultimate precision</p>
        </header>
        <section class="task-input-section">
            <form id="task-form" onsubmit="addTask(event)">
                <input type="text" id="task-input" placeholder="What needs to be done? (e.g., Study Programming)" required autocomplete="off">
                <button type="submit" class="btn-primary">Add Task</button>
            </form>
        </section>
        <section class="tasks-section"><ul id="task-list"></ul></section>
    </main>
</div>

<script>
    let isLoginMode = true;
    let currentUser = JSON.parse(localStorage.getItem('taskify_user')) || null;

    const authContainer = document.getElementById('auth-container');
    const appContainer = document.getElementById('app-container');
    const authTitle = document.getElementById('auth-title');
    const authSubtitle = document.getElementById('auth-subtitle');
    const authSubmitBtn = document.getElementById('auth-submit-btn');
    const switchText = document.getElementById('switch-text');
    const authError = document.getElementById('auth-error');
    const displayUsername = document.getElementById('display-username');
    const passwordInput = document.getElementById('password');
    const eyeIcon = document.getElementById('eye-icon');

    if (currentUser) showDashboard();

    function togglePasswordVisibility() {
        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            eyeIcon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
        } else {
            passwordInput.type = 'password';
            eyeIcon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
        }
    }

    function toggleAuthMode() {
        isLoginMode = !isLoginMode;
        authError.textContent = '';
        if (isLoginMode) {
            authTitle.textContent = 'Welcome Back';
            authSubtitle.textContent = 'Sign in to access your personal workspace';
            authSubmitBtn.textContent = 'Sign In';
            switchText.textContent = "Don't have an account? Sign Up";
        } else {
            authTitle.textContent = 'Create Account';
            authSubtitle.textContent = 'Sign up to start organizing your daily tasks';
            authSubmitBtn.textContent = 'Sign Up';
            switchText.textContent = 'Already have an account? Sign In';
        }
    }

    async function handleAuth(e) {
        e.preventDefault();
        authError.textContent = '';
        const username = document.getElementById('username').value.trim();
        const password = passwordInput.value;
        const endpoint = isLoginMode ? '/api/login' : '/api/register';

        try {
            const res = await fetch(endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || 'Authentication failed');

            if (isLoginMode) {
                currentUser = { id: data.userId, username: data.username };
                localStorage.setItem('taskify_user', JSON.stringify(currentUser));
                showDashboard();
            } else {
                isLoginMode = true;
                toggleAuthMode();
                authError.style.color = '#10b981';
                authError.textContent = 'Account created successfully! Please sign in.';
            }
        } catch (err) {
            authError.style.color = 'var(--danger)';
            authError.textContent = err.message;
        }
    }

    function showDashboard() {
        authContainer.classList.add('hidden');
        appContainer.classList.remove('hidden');
        displayUsername.textContent = `@${currentUser.username}`;
        fetchTasks();
    }

    function logout() {
        localStorage.removeItem('taskify_user');
        currentUser = null;
        appContainer.classList.add('hidden');
        authContainer.classList.remove('hidden');
        document.getElementById('username').value = '';
        passwordInput.value = '';
    }

    async function fetchTasks() {
        if (!currentUser) return;
        try {
            const res = await fetch(`/api/tasks/${currentUser.id}`);
            const tasks = await res.json();
            renderTasks(tasks);
        } catch (err) { console.error('Error fetching tasks:', err); }
    }

    function renderTasks(tasks) {
        const taskList = document.getElementById('task-list');
        taskList.innerHTML = '';
        if (tasks.length === 0) {
            taskList.innerHTML = '<li class="empty-state">No tasks yet. Add your first task above!</li>';
            return;
        }
        tasks.forEach(task => {
            const li = document.createElement('li');
            li.className = task.completed ? 'task-item completed' : 'task-item';
            li.innerHTML = `
                    <div class="task-left" onclick="toggleTask(${task.id}, ${task.completed})">
                        <div class="custom-checkbox"><svg viewBox="0 0 24 24" class="check-icon"><polyline points="20 6 9 17 4 12"/></svg></div>
                        <span class="task-text">${escapeHtml(task.text)}</span>
                    </div>
                    <div class="task-actions">
                        <button class="edit-btn" onclick="event.stopPropagation(); editTask(${task.id}, '${escapeHtml(task.text)}')">Edit</button>
                        <button class="delete-btn" onclick="event.stopPropagation(); deleteTask(${task.id})">Delete</button>
                    </div>
                `;
            taskList.appendChild(li);
        });
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML.replace(/'/g, "\\'");
    }

    async function addTask(e) {
        e.preventDefault();
        const taskInput = document.getElementById('task-input');
        const text = taskInput.value.trim();
        if (!text || !currentUser) return;
        try {
            const res = await fetch('/api/tasks', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userId: currentUser.id, text })
            });
            if (res.ok) { taskInput.value = ''; fetchTasks(); }
        } catch (err) { console.error('Error adding task:', err); }
    }

    async function toggleTask(id, currentStatus) {
        const newStatus = currentStatus ? 0 : 1;
        try {
            const res = await fetch(`/api/tasks/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ completed: newStatus })
            });
            if (res.ok) fetchTasks();
        } catch (err) { console.error('Error toggling task:', err); }
    }

    async function editTask(id, oldText) {
        const newText = prompt('Edit your task:', oldText);
        if (newText === null || newText.trim() === '' || newText.trim() === oldText) return;
        try {
            const res = await fetch(`/api/tasks/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: newText.trim() })
            });
            if (res.ok) fetchTasks();
        } catch (err) { console.error('Error editing task:', err); }
    }

    async function deleteTask(id) {
        try {
            const res = await fetch(`/api/tasks/${id}`, { method: 'DELETE' });
            if (res.ok) fetchTasks();
        } catch (err) { console.error('Error deleting task:', err); }
    }
</script>
</body>
</html>
